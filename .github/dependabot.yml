# Monthly grouped version updates, with a 7-day cooldown so brand-new releases settle
# first. Security fixes do not wait for this schedule: they open right away via the
# repo settings (Dependabot alerts + security updates).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Angular and Nx majors need `ng update` / `nx migrate`, not a bare version bump.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nx/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nx"
        update-types: ["version-update:semver-major"]
      # Released in lockstep with Angular's major version.
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@schematics/angular"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ng-zorro-antd"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ant-design/icons-angular"
        update-types: ["version-update:semver-major"]
      # Angular pins these to a minor range (compiler-cli: typescript >=6.0 <6.1),
      # so they move with `ng update`, never on their own.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
