name: CI
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx nx lint client
      - name: Build
        run: npx nx build client
      - name: Unit tests
        run: npx nx test client
