<form (submit)="submit()">
  @if (description) {
    <p class="popup-description">{{ description }}</p>
  }
  @if (type==='textarea') {
    <textarea #field nz-input [formControl]="control" rows="5" [placeholder]="placeholder" class="text-area"
      [attr.aria-label]="placeholder || null" [attr.maxlength]="maxLength">
    </textarea>
  }
  @if (type==='input') {
    <input #field type="text" nz-input [formControl]="control" [placeholder]="placeholder" class="text-area"
      [attr.aria-label]="placeholder || null" [attr.maxlength]="maxLength" [attr.autocomplete]="autocomplete"
      />
  }
  <div class="popup-buttons">
    @if (cancellable) {
      <button nz-button type="button" (click)="cancel()">Cancel</button>
    }
    <button nz-button [disabled]="!control.valid" nzType="primary"
      type="submit">Submit
    </button>
  </div>
</form>
